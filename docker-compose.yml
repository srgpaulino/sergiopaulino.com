version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    volumes:
      - dbdata:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: 3scape
      MYSQL_USER: zhaiku
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: 3scape
      DB_USERNAME: zhaiku
      DB_PASSWORD: secret
      SANCTUM_STATEFUL_DOMAINS: "localhost:3001"
      CORS_ALLOWED_ORIGINS: "http://localhost:3001"
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: >
      sh -c "composer install --no-interaction && \
             php artisan key:generate --force && \
             php artisan migrate --force && \
             php artisan serve --host=0.0.0.0 --port=8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/usr/src/app
      - frontend_node_modules:/usr/src/app/node_modules
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend:8000/api
    ports:
      - "3001:3000"
    depends_on:
      - backend
    command: npm run dev

volumes:
  dbdata:
  backend_vendor:
  frontend_node_modules:
